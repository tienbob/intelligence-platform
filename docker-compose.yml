services:
  db:
    image: pgvector/pgvector:pg16
    container_name: intelligence_stock_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intelligence_stock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: intelligence_stock_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Python Intelligence Platform ──────────────────────────────
  python-migrate:
    build: ./intelligence-platform-stock
    container_name: intelligence_stock_python_migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/intelligence_stock
    volumes:
      - ./intelligence-platform-stock:/app
    depends_on:
      db:
        condition: service_healthy
    command: bash scripts/migrate.sh

  python:
    build: ./intelligence-platform-stock
    container_name: intelligence_stock_python
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/intelligence_stock
      REDIS_URL: redis://redis:6379/0
      INTERNAL_SERVICE_KEY: ${PYTHON_SERVICE_KEY:-dev-service-key-change-me}
    expose:
      - "8001"
    volumes:
      - ./intelligence-platform-stock:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  # ── Rails API Gateway ─────────────────────────────────────────
  rails-migrate:
    build: ./intelligence-platform-api
    container_name: intelligence_stock_rails_migrate
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/intelligence_stock
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-change-me-in-production-change-me-in-production-1234}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    command: bash bin/migrate.sh

  rails:
    build: ./intelligence-platform-api
    container_name: intelligence_stock_rails
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/intelligence_stock
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-change-me-in-production-change-me-in-production-1234}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-change-me-in-production-1234}
      PYTHON_INTERNAL_URL: http://python:8001
      PYTHON_SERVICE_KEY: ${PYTHON_SERVICE_KEY:-dev-service-key-change-me}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      python:
        condition: service_started
      rails-migrate:
        condition: service_completed_successfully
    command: bundle exec puma -C config/puma.rb

  # ── React Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./intelligence-platform-frontend
      args:
        VITE_REFRESH_DASHBOARD_MS: ${VITE_REFRESH_DASHBOARD_MS:-30000}
        VITE_REFRESH_ANALYSIS_JOBS_MS: ${VITE_REFRESH_ANALYSIS_JOBS_MS:-5000}
        VITE_REFRESH_ANALYSIS_DETAIL_MS: ${VITE_REFRESH_ANALYSIS_DETAIL_MS:-5000}
    container_name: intelligence_stock_frontend
    ports:
      - "3000:80"
    depends_on:
      - rails

volumes:
  postgres_data:
  redis_data: