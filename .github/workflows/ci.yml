name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intelligence-platform-stock
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start Redis (for rate limit test)
        run: docker run -d --name ip_redis -p 6379:6379 redis:7-alpine

      - name: Run unit tests
        env:
          DEBUG: "false"
          REDIS_CACHE_ENABLED: "false"
        run: pytest tests -q --ignore=tests/integration

  integration:
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: intelligence-platform-stock
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migration/upsert integration tests
        run: bash ../scripts/integration_test.sh