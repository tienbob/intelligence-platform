server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the upstream through a variable (below)
    # forces nginx to re-resolve on every request instead of caching the IP it
    # saw at startup. Without this, recreating the `rails` container (new IP)
    # leaves nginx proxying to the dead address and every /api call returns a
    # 502 HTML page — which the frontend then fails to parse as JSON.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rails_upstream http://rails:3000;

    # Baseline response hardening (audit S04). NOTE: nginx `add_header` in a
    # location REPLACES the outer set, so /assets/ and / below repeat these —
    # keep the three lists in sync. Inline styles support charts and dynamic
    # geometry; executable scripts are restricted to same-origin bundles.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Content-hashed bundles are immutable → cache hard. A missing hashed
    # asset must 404 rather than falling back to SPA HTML, which would break
    # script loading with a misleading MIME error (audit O11).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    # SPA fallback — serve index.html for all non-file routes.
    # index.html is deliberately revalidated so a deploy takes effect
    # immediately even though /assets/* is cached for a year.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Rails API gateway
    location /api/ {
        proxy_pass $rails_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy health endpoints to the Rails API gateway.
    # NOTE: /metrics is intentionally NOT proxied — it is key-gated and must
    # not be reachable from the internet (audit S02).
    location /health/ {
        proxy_pass $rails_upstream;
        proxy_set_header Host $host;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
