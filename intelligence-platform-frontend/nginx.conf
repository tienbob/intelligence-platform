server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline response hardening (audit S04). NOTE: nginx `add_header` in a
    # location REPLACES the outer set, so /assets/ and / below repeat these —
    # keep the three lists in sync. A full CSP is deliberately deferred until
    # it can be browser-verified against the app (fonts + Material Symbols).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content-hashed bundles are immutable → cache hard. A missing hashed
    # asset must 404 rather than falling back to SPA HTML, which would break
    # script loading with a misleading MIME error (audit O11).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # SPA fallback — serve index.html for all non-file routes.
    # index.html is deliberately revalidated so a deploy takes effect
    # immediately even though /assets/* is cached for a year.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Rails API gateway
    location /api/ {
        proxy_pass http://rails:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy health endpoints to the Rails API gateway.
    # NOTE: /metrics is intentionally NOT proxied — it is key-gated and must
    # not be reachable from the internet (audit S02).
    location /health/ {
        proxy_pass http://rails:3000;
        proxy_set_header Host $host;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}